; ============================================================================
;  GameHub 引擎 / 运行时特征规则集
; ============================================================================
;
;  格式与 SteamDatabase/FileDetectionRuleSets 的 rules.ini 完全兼容，
;  可直接把该仓库的 rules.ini 放到 data/rules/rules.ini 覆盖本文件，
;  以获得 400+ 条完整规则（含 SDK / 反作弊 / 启动器）。
;  来源：https://github.com/SteamDatabase/FileDetectionRuleSets
;
;  语法：
;    [Section]                  分类，本文件使用 Engine / Evidence / Emulator / Marker
;    Name = 正则                 命中即认为属于该引擎
;    Name[] = 正则               同名多条规则，任一命中即可
;    正则大小写不敏感，运行在完整路径上，路径分隔符统一为 /
;    支持 PCRE 的 ++ 与 (?>...) 写法，加载时会自动转换为 Python 兼容形式
; ============================================================================


