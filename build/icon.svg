<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="0.45" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#0055d4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00337a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- iOS 风格圆角方形（squircle 近似） -->
  <rect x="34" y="34" width="444" height="444" rx="104" fill="url(#bg)" filter="url(#soft)"/>
  <rect x="34" y="34" width="444" height="444" rx="104" fill="url(#sheen)"/>
  <rect x="34" y="34" width="444" height="444" rx="104" fill="none"
        stroke="#ffffff" stroke-opacity="0.30" stroke-width="2.5"/>

  <!-- 游戏手柄 -->
  <g transform="translate(256,258)" fill="none" stroke="#ffffff"
     stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-104 -46 h208
             a62 62 0 0 1 60 74
             l-14 62
             a44 44 0 0 1 -78 20
             l-22 -30
             h-100
             l-22 30
             a44 44 0 0 1 -78 -20
             l-14 -62
             a62 62 0 0 1 60 -74 z"
          fill="#ffffff" fill-opacity="0.16"/>
    <path d="M-62 0 h44 M-40 -22 v44"/>
    <circle cx="58" cy="-12" r="10" fill="#ffffff" stroke="none"/>
    <circle cx="84" cy="14" r="10" fill="#ffffff" stroke="none"/>
    <circle cx="32" cy="14" r="10" fill="#ffffff" stroke="none"/>
  </g>
</svg>
